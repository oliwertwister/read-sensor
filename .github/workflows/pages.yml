name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      satellite_only:
        description: Skip application tests for a scheduler-triggered satellite refresh
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a push validation/deploy just because the 15-minute refresh fires.
  # New refreshes wait for the current Pages run instead, preventing false cancelled checks.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      READ_SENSOR_TRANSFER_LOG: monitor/raw/transfers.jsonl
      MONITOR_STEP_DIR: monitor/raw/steps
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize deployment monitor
        run: |
          mkdir -p monitor/raw/steps
          date +%s > monitor/raw/workflow-start.txt

      - name: Verify R2 upload identity
        env:
          MODEL_CUBE_AUTH_CHECK_URL: https://read-sensor-api.read-sensor.workers.dev/api/v1/model-cube-upload-auth-check
        run: |
          OIDC_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=read-sensor-r2-upload")
          OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_JSON")
          CLAIMS=$(OIDC_TOKEN="$OIDC_TOKEN" python -c 'import base64,json,os; token=os.environ["OIDC_TOKEN"]; payload=token.split(".")[1]; payload += "=" * (-len(payload) % 4); data=json.loads(base64.urlsafe_b64decode(payload)); keys=("iss","aud","repository","ref","event_name","environment","repository_visibility","runner_environment","workflow_ref","sub"); print(json.dumps({key:data.get(key) for key in keys}, sort_keys=True))')
          echo "GitHub OIDC safe claims: $CLAIMS"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $OIDC_TOKEN" \
            "$MODEL_CUBE_AUTH_CHECK_URL"

      - name: Set up Node.js
        if: github.event_name == 'push' || inputs.satellite_only != true
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test Worker
        if: github.event_name == 'push' || inputs.satellite_only != true
        run: npm test --prefix worker

      - name: Check frontend JavaScript
        if: github.event_name == 'push' || inputs.satellite_only != true
        run: |
          node --check app.js
          node --check model-map.js
          node --check data-monitor.js
          node --check config.js
          node --check geometry-loader.js
          node --check geometry-ui.js
          node --check synop.js
          node synop/test_decode.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            model/requirements.txt
            satellite/requirements-native.txt

      - name: Build live SYNOP map layer
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.satellite_only }}" != "true" ]; then
            python synop/test_update_synop.py
            python synop/test_update_live.py
          fi
          python monitor/run_with_metrics.py --name "SYNOP refresh" -- python synop/update_live.py --catalog synop/stations.json --output synop/output/live.json

      - name: Install geospatial render dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet -r model/requirements.txt
          python model/test_metpy_diagnostics.py
          python -m py_compile satellite/render_satpy.py

      - name: Hydrate last known-good Meteosat products
        run: |
          mkdir -p satellite/output
          BASE="https://oliwertwister.github.io/read-sensor/satellite"
          for file in latest.json geocolour.webp geocolour-raw.webp ir105.webp ir105-raw.webp; do
            tmp="satellite/output/${file}.download"
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 1 --max-time 30               "$BASE/$file" -o "$tmp"; then
              mv "$tmp" "satellite/output/$file"
            else
              rm -f "$tmp"
              echo "No deployed fallback available for $file; continuing with live source"
            fi
          done

      - name: Test Meteosat fallback handling
        run: PYTHONPATH=.:satellite python satellite/test_render_satellite.py

      - name: Render latest Meteosat products
        run: python monitor/run_with_metrics.py --name "EUMETView WMS baseline" -- python satellite/render_satellite.py --output satellite/output

      - name: Upgrade Meteosat products with native FCI via Satpy when credentials are available
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: |
          if [ -z "$EUMETSAT_CONSUMER_KEY" ] || [ -z "$EUMETSAT_CONSUMER_SECRET" ]; then
            echo "Native FCI/Satpy path skipped: EUMETSAT Data Store credentials are not configured."
            exit 0
          fi
          if ! python -m pip install --disable-pip-version-check --quiet -r satellite/requirements-native.txt; then
            echo "::warning::Satpy dependency installation failed; keeping the WMS satellite products."
            exit 0
          fi
          if ! PYTHONPATH=.:satellite python monitor/run_with_metrics.py --name "Native FCI / Satpy" -- python satellite/render_satpy.py --output satellite/output; then
            echo "::warning::Native FCI/Satpy refresh failed; keeping the WMS satellite products."
          fi

      - name: Render quantitative ICON-EU static and interactive products
        run: python monitor/run_with_metrics.py --name "ICON-EU / MetPy render" -- python model/render_icon_products.py --output model/output --background satellite/output/geocolour.webp

      - name: Publish Zarr cube to R2 with GitHub OIDC
        env:
          MODEL_CUBE_UPLOAD_URL: https://read-sensor-api.read-sensor.workers.dev/api/v1/model-cube-upload
        run: |
          OIDC_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=read-sensor-r2-upload")
          MODEL_UPLOAD_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_JSON")
          export MODEL_UPLOAD_TOKEN
          python monitor/run_with_metrics.py --name "R2 Zarr publish" -- python model/upload_zarr_cube.py

      - name: Stage public files
        run: |
          mkdir _site
          cp index.html app.js model-map.js data-monitor.js cube-storage.js synop.js config.js style.css geometry-loader.js geometry-ui.js rar-worker.js _site/
          cp -R vendor _site/
          mkdir -p _site/satellite
          cp -R satellite/output/. _site/satellite/
          mkdir -p _site/model
          cp -R model/output/. _site/model/
          rm -rf _site/model/cube.zarr
          mkdir -p _site/synop
          cp synop/stations.json _site/synop/latest.json
          cp synop/output/live.json _site/synop/live.json

      - name: Build deployment data monitor
        run: python monitor/build_monitor.py --site _site --cube model/output/cube.zarr --output _site/monitor/latest.json

      - name: Guard free-tier storage limits
        run: |
          test ! -d _site/model/cube.zarr || { echo "Refusing to publish Zarr cube to GitHub Pages"; exit 1; }
          SITE_KIB=$(du -sk _site | awk '{print $1}')
          SOFT_SITE_KIB=$((380 * 1024))
          MAX_SITE_KIB=$((500 * 1024))
          echo "Staged Pages size: $((SITE_KIB / 1024)) MiB / 380 MiB planning target / 500 MiB project safety ceiling"
          if [ "$SITE_KIB" -gt "$SOFT_SITE_KIB" ]; then
            echo "::warning::Staged site exceeds the 380 MiB planning target; review Data Monitor before adding more persistent layers."
          fi
          if [ "$SITE_KIB" -gt "$MAX_SITE_KIB" ]; then
            echo "Refusing deployment: staged site exceeds 500 MiB safety ceiling"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
