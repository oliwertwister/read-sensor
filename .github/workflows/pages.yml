name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      satellite_only:
        description: Skip application tests for a scheduler-triggered satellite refresh
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a push validation/deploy just because the 15-minute refresh fires.
  # New refreshes wait for the current Pages run instead, preventing false cancelled checks.
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: github.event_name == 'push' || inputs.satellite_only != true
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test Worker
        if: github.event_name == 'push' || inputs.satellite_only != true
        run: npm test --prefix worker

      - name: Check frontend JavaScript
        if: github.event_name == 'push' || inputs.satellite_only != true
        run: |
          node --check app.js
          node --check model-map.js
          node --check config.js
          node --check geometry-loader.js
          node --check geometry-ui.js
          node --check synop.js
          node synop/test_decode.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Build live SYNOP map layer
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.satellite_only }}" != "true" ]; then
            python synop/test_update_synop.py
            python synop/test_update_live.py
          fi
          python synop/update_live.py --catalog synop/stations.json --output synop/output/live.json

      - name: Install geospatial render dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r model/requirements.txt

      - name: Render latest Meteosat products
        run: python satellite/render_satellite.py --output satellite/output

      - name: Render quantitative ICON-EU static and interactive products
        run: python model/render_icon_products.py --output model/output --background satellite/output/geocolour.webp

      - name: Publish Zarr cube to R2 when configured
        env:
          MODEL_CUBE_UPLOAD_URL: ${{ secrets.MODEL_CUBE_UPLOAD_URL }}
          MODEL_UPLOAD_TOKEN: ${{ secrets.MODEL_UPLOAD_TOKEN }}
        run: python model/upload_zarr_cube.py

      - name: Stage public files
        run: |
          mkdir _site
          cp index.html app.js model-map.js cube-storage.js synop.js config.js style.css geometry-loader.js geometry-ui.js rar-worker.js _site/
          cp -R vendor _site/
          mkdir -p _site/satellite
          cp -R satellite/output/. _site/satellite/
          mkdir -p _site/model
          cp -R model/output/. _site/model/
          rm -rf _site/model/cube.zarr
          mkdir -p _site/synop
          cp synop/stations.json _site/synop/latest.json
          cp synop/output/live.json _site/synop/live.json
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
