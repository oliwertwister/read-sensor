name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test Worker
        run: npm test --prefix worker
      - name: Check frontend JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check geometry-loader.js
          node --check geometry-ui.js
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html app.js config.js style.css geometry-loader.js geometry-ui.js rar-worker.js _site/
          cp -R vendor _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
